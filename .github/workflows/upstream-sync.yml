name: Upstream sync

# Fast-forwards main from NousResearch/hermes-agent and strips inherited
# workflows so this fork does not run upstream CI.
#
# Needs secret UPSTREAM_SYNC_TOKEN: a PAT with Contents + Workflows.

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update main from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require sync token (workflows scope)
        env:
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "${UPSTREAM_SYNC_TOKEN}" ]; then
            echo "::error::Missing secret UPSTREAM_SYNC_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Sync upstream into main
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          UPSTREAM_REPO: NousResearch/hermes-agent
          UPSTREAM_BRANCH: main
          UPSTREAM_URL: https://github.com/NousResearch/hermes-agent.git
        run: |
          chmod +x .github/scripts/upstream-fork-sync.sh
          .github/scripts/upstream-fork-sync.sh
